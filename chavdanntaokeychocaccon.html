<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Panel • FAROS SYSTEM</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg: #0b0b14; --surface: rgba(20, 20, 38, 0.85); --glass-border: rgba(255, 255, 255, 0.12);
      --text: #f0f0f8; --text-secondary: #b0b0c8; --ios-blue: #0a84ff; --danger: #ff3b30; --success: #00ff88; --radius-lg: 28px;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      --shadow-glass: 0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 10px; }
    #dustCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .glass-panel { background: var(--surface); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1.5px solid var(--glass-border); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 420px; box-shadow: var(--shadow-glass); }
    .glass-panel h2 { text-align: center; margin-bottom: 20px; font-weight: 800; background: linear-gradient(135deg, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
    .glass-input, .glass-select { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1.5px solid var(--glass-border); border-radius: 12px; color: #fff; font-size: 1rem; outline: none; }
    .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #0a84ff, #005bb5); border: none; border-radius: 12px; color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
    .key-list { margin-top: 20px; max-height: 300px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 10px; border: 1px solid var(--glass-border); }
    .key-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
    .key-item span { color: #00ff88; font-family: monospace; font-weight: bold; }
    .action-btns { display: flex; gap: 6px; }
    .btn-delete { background: var(--danger); border: none; color: white; padding: 6px 10px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }
    .btn-copy { background: linear-gradient(135deg, #00ff88, #00b35f); border: none; color: #000; padding: 6px 10px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="dustCanvas"></canvas>
  <div class="glass-panel">
    <h2>PANEL ADMIN FAROS</h2>
    <div class="input-group">
      <label>Tạo Key (Để trống sẽ Random theo HSD):</label>
      <div style="display: flex; gap:10px;">
        <input type="text" id="adminCustomKey" class="glass-input" placeholder="FAROS-1D-XXXXX...">
        <button class="btn-primary" id="btnRandomKey" style="width: 80px;">🎲</button>
      </div>
    </div>
    <div class="input-group" style="display: flex; gap:10px;">
      <div style="flex:1;"><label>HSD:</label><select id="adminDuration" class="glass-select"><option value="lifetime">Vĩnh viễn</option><option value="1">1 Ngày</option><option value="3">3 Ngày</option><option value="7">7 Ngày</option><option value="15">15 Ngày</option><option value="30">30 Ngày</option></select></div>
      <div style="flex:1;"><label>Máy:</label><input type="number" id="adminDevices" class="glass-input" value="1" min="1"></div>
    </div>
    <button class="btn-primary" id="btnCreateKey">➕ TẠO KEY MỚI</button>
    <div class="key-list" id="adminKeyList">Đang tải...</div>
    <button class="btn-primary" style="margin-top:10px; background:transparent; border:1px solid var(--glass-border); color:var(--text-secondary);" onclick="window.location.href='nhapkey.html'">🔙 Quay lại</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7UvVO5G5EgCwoYd-VgJYXylUw1nOGSlI",
      databaseURL: "https://shopfarossite-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Dust Effect
    const dCanvas = document.getElementById('dustCanvas'); const dCtx = dCanvas.getContext('2d'); let particles = [];
    function resizeDust() { dCanvas.width = window.innerWidth; dCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeDust); resizeDust();
    for(let i=0; i<40; i++) particles.push({ x: Math.random() * dCanvas.width, y: Math.random() * dCanvas.height, r: Math.random() * 2 + 0.5, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, alpha: Math.random() * 0.5 + 0.1 });
    function drawDust() { dCtx.clearRect(0,0, dCanvas.width, dCanvas.height); particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x < 0 || p.x > dCanvas.width) p.vx *= -1; if(p.y < 0 || p.y > dCanvas.height) p.vy *= -1; dCtx.beginPath(); dCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); dCtx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`; dCtx.fill(); }); requestAnimationFrame(drawDust); } drawDust();

    function makeRandomString(length) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function getKeyPrefix(dur) {
      if (dur === 'lifetime') return 'FAROS-LT-';
      return `FAROS-${dur}D-`;
    }

    function formatFullDate(timestamp) {
      if (!timestamp) return 'Không rõ';
      const date = new Date(timestamp);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      const day = date.getDate();
      const month = date.getMonth() + 1;
      const year = date.getFullYear();
      return `${hours}:${minutes}:${seconds} - ${day}/${month}/${year}`;
    }

    // ĐÃ ĐỔI SANG ĐƯỜNG DẪN BẢO MẬT MỚI
    function renderKeys() {
      db.ref('Keys_farosWvdann_secure_x367_369_36_67').on('value', (snap) => {
        const list = document.getElementById('adminKeyList'); list.innerHTML = '';
        const data = snap.val();
        if(!data) { list.innerHTML = 'Chưa có key nào.'; return; }
        
        const keyArray = [];
        Object.keys(data).forEach(key => {
          keyArray.push(data[key]);
        });

        keyArray.sort((a, b) => {
          let timeA = a.createdAt || 0;
          let timeB = b.createdAt || 0;
          return timeB - timeA;
        });

        keyArray.forEach(k => {
          let ex = k.expire ? formatFullDate(k.expire) : 'Vĩnh viễn';
          let dev = k.devices ? Object.keys(k.devices).length : 0;
          list.innerHTML += `
            <div class="key-item">
              <div>
                <span>${k.code}</span><br>
                <small>${dev}/${k.limit} máy | Hết hạn: ${ex}</small>
              </div>
              <div class="action-btns">
                <button class="btn-copy" onclick="copyKey('${k.code}')">COPY</button>
                <button class="btn-delete" onclick="deleteKey('${k.code}')">XÓA</button>
              </div>
            </div>`;
        });
      });
    }

    document.getElementById('btnRandomKey').addEventListener('click', () => {
      const dur = document.getElementById('adminDuration').value;
      const prefix = getKeyPrefix(dur);
      const suffix = makeRandomString(5);
      document.getElementById('adminCustomKey').value = prefix + suffix;
    });

    // ĐÃ ĐỔI SANG ĐƯỜNG DẪN BẢO MẬT MỚI
    document.getElementById('btnCreateKey').addEventListener('click', () => {
      let val = document.getElementById('adminCustomKey').value.trim();
      const dur = document.getElementById('adminDuration').value;
      const limit = parseInt(document.getElementById('adminDevices').value) || 1;

      if(!val) {
        const prefix = getKeyPrefix(dur);
        const suffix = makeRandomString(5);
        val = prefix + suffix;
      }

      let expire = dur === 'lifetime' ? null : Date.now() + (parseInt(dur) * 24 * 60 * 60 * 1000);
      let nowTimestamp = Date.now();
      
      db.ref('Keys_farosWvdann_secure_x367_369_36_67/' + val).set({ 
        code: val, 
        limit: limit, 
        expire: expire, 
        devices: {},
        createdAt: nowTimestamp 
      }).then(() => {
        document.getElementById('adminCustomKey').value = '';
      }).catch((error) => {
        alert('Lỗi tạo key: ' + error.message);
      });
    });

    window.copyKey = (code) => {
      navigator.clipboard.writeText(code).then(() => {
        alert('Đã sao chép key: ' + code);
      }).catch(() => {
        const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t);
        t.select(); document.execCommand('copy'); document.body.removeChild(t);
        alert('Đã sao chép key: ' + code);
      });
    };

    // ĐÃ ĐỔI SANG ĐƯỜNG DẪN BẢO MẬT MỚI
    window.deleteKey = (code) => { 
        if(confirm('Xóa key ' + code + '?')) {
            db.ref('Keys_farosWvdann_secure_x367_369_36_67/' + code).remove(); 
        }
    };
    
    renderKeys();
  </script>
</body>
</html>
